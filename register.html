<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/myjs.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="container">
        <form class="register-form">
            <h1 class="form-header">Register</h1>
            <div class="form-child-1">
                <input type="text" class="id_username" name="id_username" id="id_username" placeholder="Username">
            </div>
            <div class="form-child-4">
                <input type="email" name="id_email" id="id_email" placeholder="Email Address">
            </div>
            <div class="form-child-5">
                <input type="password" class="id_password" name="id_password" id="id_password" placeholder="Password">
                <!-- <i class="fa-solid fa-eye-low-vision"></i> -->
                <i class="fa-solid fa-eye"></i>
            </div>
            <div class="form-child-5">
                <input type="password" class="id_confirm_password" name="id_confirm_password" id="id_confirm_password" placeholder="Confirm Password">
                <!-- <i class="fa-solid fa-eye-low-vision"></i> -->
                <i class="fa-solid fa-eye"></i>
            </div>
            <button type="submit">Continue</button>
            <p>or Connect With Social Media</p>
            <div class="div-icons">
                <button class="twitter-icon">
                    <i class="fa-brands fa-twitter"></i>
                    Sign in With Twitter
                </button>
                <button class="facebook-icon">
                    <i class="fa-brands fa-facebook-f"></i>
                    Sign in With Facebook
                </button>
            </div>
        </form>
    </div>
</body>
</html>
